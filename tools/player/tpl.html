<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talentsmith – leveling player (prototype)</title>
<style>
:root{color-scheme:dark;--night:#0b0e15;--deep:#11151f;--plate:#171c28;--plate-2:#1f2533;--edge:#2c3242;--gold:#e9b44c;--gold-soft:#f6d68e;--ember:#ff7a2f;--ink:#ede4d3;--muted:#a39886;--green:#6fd28c;--fd:"Cinzel",Georgia,serif;--fb:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font:16px/1.5 var(--fb)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
.proto{font:600 12px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--ember);border:1px solid rgba(255,122,47,.45);background:#3a2216;border-radius:5px;padding:2px 8px;display:inline-block}
h1{font:800 clamp(22px,4vw,32px)/1.15 var(--fd);color:var(--gold-soft);margin:10px 0 4px;display:flex;align-items:center;gap:12px}
h1 img{width:40px;height:40px;border-radius:8px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.seg button{font:600 14px/1 var(--fb);padding:9px 16px;background:none;border:0;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1205}
/* now playing */
.now{display:flex;align-items:center;gap:12px;min-height:64px;background:var(--plate);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.now .lv{font:800 13px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:64px}
.now .lv b{display:block;font:800 26px/1 var(--fd);color:var(--gold-soft);letter-spacing:0}
.now img{width:40px;height:40px;border-radius:7px;border:2px solid var(--gold);flex:none}
.now .nm{font-weight:700}.now .nm small{color:var(--muted);font-weight:600;margin-left:6px}
.now p{margin:2px 0 0;color:#d8cfbf;font-size:14.5px;line-height:1.4}
.now .nx{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;flex:none;max-width:30%}
.now .nx b{display:block;color:#cfc6b6;font-size:14px}
/* tabs (phones) */
.tabs{display:none;gap:6px;margin:0 0 10px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--fb);padding:8px 6px;border-radius:9px;border:1px solid var(--edge);background:var(--plate);color:var(--muted);cursor:pointer}
.tabs button img{width:20px;height:20px;border-radius:4px}
.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-soft)}
/* trees */
.stage{position:relative}
.trees{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tree{position:relative;background:linear-gradient(180deg,rgba(11,14,21,.45),rgba(11,14,21,.72)),var(--bg) center top/cover no-repeat,var(--plate);border:1px solid var(--edge);border-radius:10px;padding:10px 10px 12px;transition:filter .6s,opacity .6s,border-color .6s}
.tree.dim{filter:grayscale(.85) brightness(.5)}
.tree.on{border-color:rgba(233,180,76,.55)}
.th{display:flex;align-items:center;gap:8px;font:800 17px var(--fd);color:var(--gold-soft);margin:0 0 6px}
.th img{width:24px;height:24px;border-radius:5px}.th span{margin-left:auto;font:700 14px var(--fb);color:var(--muted)}
.grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,84px);gap:2px}
.grid svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cell{display:flex;flex-direction:column;align-items:center}
.node{position:relative;width:44px;height:44px;margin-top:4px;border-radius:7px;border:2px solid #4a5163;background:#1a1f2b center/cover no-repeat;transition:border-color .3s,box-shadow .3s,filter .3s;filter:grayscale(1) brightness(.55)}
.node.some{filter:none;border-color:var(--green);box-shadow:0 0 10px rgba(111,210,140,.35)}
.node.max{filter:none;border-color:var(--gold);box-shadow:0 0 14px rgba(255,122,47,.55)}
.node .rk{position:absolute;right:-9px;bottom:-7px;font:700 11px/1 var(--fb);background:var(--night);border:1px solid #4a5163;border-radius:4px;padding:2px 4px;color:var(--muted)}
.node.some .rk{color:var(--green);border-color:var(--green)}.node.max .rk{color:var(--gold-soft);border-color:var(--gold)}
.lbl{font:600 11.5px/1.15 var(--fb);color:#bdb3a2;text-align:center;margin-top:6px;max-width:92px}
.node.some+.lbl,.node.max+.lbl{color:var(--ink)}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
/* player */
.player{position:sticky;bottom:0;z-index:10;margin-top:14px;background:rgba(17,21,31,.96);backdrop-filter:blur(6px);border:1px solid var(--edge);border-radius:14px;padding:10px 14px 12px}
.ctrls{display:flex;align-items:center;gap:8px}
.ctrls button{width:42px;height:42px;border-radius:50%;border:1px solid var(--edge);background:var(--plate);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ctrls button svg{width:18px;height:18px;fill:currentColor}
.ctrls button.play{width:52px;height:52px;background:var(--gold);border-color:var(--gold);color:#1a1205}
.ctrls button.play svg{width:22px;height:22px}
.ctrls button:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
.ctrls .lvtxt{margin-left:auto;font:700 14px var(--fb);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{position:relative;margin:12px 4px 0}
.bar input{width:100%;margin:0;accent-color:var(--gold);height:28px;cursor:pointer}
.ticks{position:relative;height:14px;font:600 11px var(--fb);color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.chg{position:absolute;top:2px;height:6px;width:2px;border-radius:1px;transform:translateX(-50%);pointer-events:none}
/* text mode */
.list{display:none;background:var(--plate);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.list table{width:100%;border-collapse:collapse}
.list td{padding:7px 12px;border-top:1px solid var(--edge);font-size:15px}
.list tr{cursor:pointer}.list tr:hover td{background:#1c2230}
.list tr.cur td{background:rgba(233,180,76,.12)}.list tr.done td{color:var(--ink)}.list tr:not(.done) td{color:var(--muted)}
.list td:first-child{width:60px;font-variant-numeric:tabular-nums;color:var(--muted)}
.list img{width:24px;height:24px;border-radius:4px;vertical-align:-6px;margin-right:8px}
body.text .stage,body.text .tabs,body.text .now{display:none}body.text .list{display:block}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
@media(max-width:820px){.trees{grid-template-columns:1fr}.tree:not(.show){display:none}.tabs{display:flex}.tree.dim{filter:none}.now .nx{display:none}}
@media (prefers-reduced-motion:reduce){.tree,.node{transition:none}}
</style></head>
<body>
<div class="wrap">
<span class="proto">Prototype · not on the site</span>
<div class="top"><h1 id="title"></h1>
<div class="seg" id="mode"><button type="button" data-m="anim" aria-pressed="true">Animation</button><button type="button" data-m="text" aria-pressed="false">Text</button></div></div>
<div class="now" id="now"></div>
<div class="tabs" id="tabs"></div>
<div class="stage" id="stage"><div class="trees" id="trees"></div><canvas id="fx"></canvas></div>
<div class="list" id="list"><table><tbody id="rows"></tbody></table></div>
<div class="player">
 <div class="ctrls">
  <button type="button" id="reset" title="Back to the start" aria-label="Back to the start"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  <button type="button" id="prev" title="One level back" aria-label="One level back"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
  <button type="button" class="play" id="play" title="Play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="pi" d="M8 5v14l11-7z"/></svg></button>
  <button type="button" id="next" title="One level forward" aria-label="One level forward"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  <span class="lvtxt" id="lvtxt"></span>
 </div>
 <div class="bar"><div id="marks"></div><input type="range" id="seek" min="0" max="51" value="0" aria-label="Level"><div class="ticks" id="ticks"></div></div>
</div>
<p class="hint">Plays one talent point per level: 2 sec when it moves to a new talent, 0.5 sec for another rank of the same talent. Drag the bar to jump to any level. The bright trail is the talent just taken; the faint one is the next new talent.</p>
</div>
<script>
const D=__DATA__;
const $=s=>document.querySelector(s);
const N=D.seq.length;let k=0,playing=false,timer=null,showTree=0,manualTab=false;
$("#title").innerHTML=`<img src="${D.trees[0].icon}" alt="">${D.cls} – ${D.name}`;
// split → title icon = tree with most points
{const sp=[0,0,0];D.seq.forEach(s=>sp[s.t]++);const m=sp.indexOf(Math.max(...sp));$("#title img").src=D.trees[m].icon;}
// build trees
const trees=$("#trees"),nodeEl=D.trees.map(()=>[]);
D.trees.forEach((t,ti)=>{const el=document.createElement("div");el.className="tree";el.style.setProperty("--bg",`url(${t.bg})`);el.dataset.t=ti;
 el.innerHTML=`<div class="th"><img src="${t.icon}" alt="">${t.name}<span id="tp${ti}">0</span></div><div class="grid"><svg></svg></div>`;
 const g=el.querySelector(".grid");
 t.t.forEach((x,i)=>{const c=document.createElement("div");c.className="cell";c.style.gridRow=x.r;c.style.gridColumn=x.c;
  c.innerHTML=`<div class="node" style="background-image:url(${x.i})"><span class="rk">0/${x.m}</span></div><div class="lbl">${x.n}</div>`;g.appendChild(c);nodeEl[ti][i]=c.querySelector(".node");});
 trees.appendChild(el);});
const tabs=$("#tabs");D.trees.forEach((t,ti)=>{const b=document.createElement("button");b.type="button";b.dataset.t=ti;b.innerHTML=`<img src="${t.icon}" alt="">${t.name}`;tabs.appendChild(b);});
tabs.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;showTree=+b.dataset.t;manualTab=true;paintTabs();});
function paintTabs(){tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.t===showTree));document.querySelectorAll(".tree").forEach(t=>t.classList.toggle("show",+t.dataset.t===showTree));requestAnimationFrame(drawLinks);}
function drawLinks(){document.querySelectorAll(".tree").forEach(tr=>{const ti=+tr.dataset.t,g=tr.querySelector(".grid"),s=g.querySelector("svg"),gb=g.getBoundingClientRect();if(!gb.width)return;let h="";
 D.trees[ti].t.forEach((x,i)=>{if(!x.q)return;const r=D.trees[ti].t.findIndex(y=>y.n===x.q);const a=nodeEl[ti][r].getBoundingClientRect(),b=nodeEl[ti][i].getBoundingClientRect();
  const met=P[ti][r]>=D.trees[ti].t[r].m,c=met?"#e9b44c":"rgba(214,196,166,.28)";let x1,y1,x2,y2;
  if(Math.abs(a.top-b.top)<4){const d=b.left>a.left?1:-1;y1=y2=a.top+a.height/2-gb.top;x1=(d>0?a.right+6:a.left-6)-gb.left;x2=(d>0?b.left-7:b.right+7)-gb.left;}
  else{x1=x2=a.left+a.width/2-gb.left;y1=a.bottom+22-gb.top;y2=b.top-7-gb.top;}
  const L=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/L,uy=(y2-y1)/L,px=-uy,py=ux,hh=6;
  h+=`<line x1="${x1}" y1="${y1}" x2="${x2-ux*hh*.6}" y2="${y2-uy*hh*.6}" stroke="${c}" stroke-width="2" stroke-linecap="round"/><path d="M${x2} ${y2}L${x2-ux*hh+px*hh*.65} ${y2-uy*hh+py*hh*.65}L${x2-ux*hh-px*hh*.65} ${y2-uy*hh-py*hh*.65}Z" fill="${c}"/>`;});
 s.innerHTML=h;});}
// text list
$("#rows").innerHTML=D.seq.map((s,j)=>{const x=D.trees[s.t].t[s.i];return `<tr data-k="${j+1}"><td>${j+10}</td><td><img src="${x.i}" alt="">${x.n} <span style="color:var(--muted)">${s.r}/${x.m}</span></td><td style="color:var(--muted)">${D.trees[s.t].name}</td></tr>`;}).join("");
$("#rows").addEventListener("click",e=>{const r=e.target.closest("tr");if(r){stop();go(+r.dataset.k,true);}});
// seek bar marks: a tick where the talent changes, colored by tree
const TC=["#f6d68e","#7fb2ff","#ff8a5c"];
$("#marks").innerHTML=D.seq.map((s,j)=>{const nw=j===0||D.seq[j-1].t!==s.t||D.seq[j-1].i!==s.i;return nw?`<span class="chg" style="left:calc(${(j+1)/N*100}% );background:${TC[s.t]}"></span>`:"";}).join("");
$("#ticks").innerHTML=[10,20,30,40,50,60].map(l=>`<span style="left:${(l-9)/N*100}%">${l}</span>`).join("");
// state
let P=D.trees.map(t=>t.t.map(()=>0));
function compute(kk){P=D.trees.map(t=>t.t.map(()=>0));for(let j=0;j<kk;j++){const s=D.seq[j];P[s.t][s.i]=s.r;}}
function nextNew(kk){const cur=kk>0?D.seq[kk-1]:null;for(let j=kk;j<N;j++){const s=D.seq[j];if(!cur||s.t!==cur.t||s.i!==cur.i)return s;}return null;}
function paint(){compute(k);
 D.trees.forEach((t,ti)=>{let sum=0;t.t.forEach((x,i)=>{const r=P[ti][i];sum+=r;const n=nodeEl[ti][i];n.classList.toggle("some",r>0&&r<x.m);n.classList.toggle("max",r>=x.m);n.querySelector(".rk").textContent=r+"/"+x.m;});$("#tp"+ti).textContent=sum;});
 const cur=k>0?D.seq[k-1]:null,nx=nextNew(k),act=cur?cur.t:(nx?nx.t:0);
 document.querySelectorAll(".tree").forEach(t=>{t.classList.toggle("dim",+t.dataset.t!==act);t.classList.toggle("on",+t.dataset.t===act);});
 if(!manualTab||playing){showTree=act;manualTab=false;}paintTabs();
 const lv=k+9;$("#lvtxt").textContent=k?`Level ${lv} · ${k}/51 points`:"Level 9 · no points yet";$("#seek").value=k;
 if(cur){const x=D.trees[cur.t].t[cur.i];$("#now").innerHTML=`<div class="lv">Level<b>${lv}</b></div><img src="${x.i}" alt=""><div><div class="nm">${x.n}<small>${cur.r}/${x.m} · ${D.trees[cur.t].name}</small></div><p>${cur.tx}</p></div>${nx?`<div class="nx">Next<b>${D.trees[nx.t].t[nx.i].n}</b></div>`:""}`;}
 else $("#now").innerHTML=`<div class="lv">Level<b>9</b></div><div><div class="nm">Press play</div><p>Your first talent point comes at level 10.</p></div>${nx?`<div class="nx">Next<b>${D.trees[nx.t].t[nx.i].n}</b></div>`:""}`;
 document.querySelectorAll("#rows tr").forEach(r=>{const j=+r.dataset.k;r.classList.toggle("done",j<=k);r.classList.toggle("cur",j===k);});
 FX.cur=cur?nodeEl[cur.t][cur.i]:null;FX.next=nx?nodeEl[nx.t][nx.i]:null;
 $("#pi").setAttribute("d",playing?"M7 5h4v14H7zM13 5h4v14h-4z":"M8 5v14l11-7z");$("#play").setAttribute("aria-label",playing?"Pause":"Play");$("#play").title=playing?"Pause":"Play";
 requestAnimationFrame(drawLinks);}
function go(nk,quiet){const was=k;k=Math.max(0,Math.min(N,nk));paint();if(!quiet&&k===was+1&&k>0){const s=D.seq[k-1];FX.burst(nodeEl[s.t][s.i]);}}
function delay(){if(k>=N)return null;const s=D.seq[k],p=k>0?D.seq[k-1]:null;return p&&p.t===s.t&&p.i===s.i?500:2000;}
function tick(){if(!playing)return;if(k>=N){stop();return;}go(k+1);const d=delay();if(d==null){stop();return;}timer=setTimeout(tick,d);}
function start(){if(k>=N)go(0,true);playing=true;paint();clearTimeout(timer);timer=setTimeout(tick,k===0?600:delay());}
function stop(){playing=false;clearTimeout(timer);paint();}
$("#play").onclick=()=>playing?stop():start();
$("#next").onclick=()=>{stop();go(k+1);};
$("#prev").onclick=()=>{stop();go(k-1,true);};
$("#reset").onclick=()=>{stop();go(0,true);};
$("#seek").oninput=e=>{const v=+e.target.value;playing=false;clearTimeout(timer);go(v,true);};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.code==="Space"){e.preventDefault();playing?stop():start();}else if(e.key==="ArrowRight"){stop();go(k+1);}else if(e.key==="ArrowLeft"){stop();go(k-1,true);}});
$("#mode").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;document.body.classList.toggle("text",b.dataset.m==="text");$("#mode").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));if(b.dataset.m==="anim")requestAnimationFrame(()=>{FX.size();drawLinks();});};
addEventListener("resize",()=>{FX.size();drawLinks();});
// ---------- particle snakes ----------
const FX=(()=>{const cv=$("#fx"),cx=cv.getContext("2d"),st=$("#stage");let W=0,H=0,dpr=1;const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
 function size(){const r=st.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";}
 const parts=[],rings=[];
 function rectOf(el){if(!el)return null;const a=el.getBoundingClientRect(),b=st.getBoundingClientRect();if(!a.width)return null;return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};}
 function perim(R,pad,t){// point on a rounded square around R, t in [0,1)
  const x=R.x-pad,y=R.y-pad,w=R.w+2*pad,h=R.h+2*pad,L=2*(w+h);let d=((t%1)+1)%1*L;
  if(d<w)return[x+d,y];d-=w;if(d<h)return[x+w,y+d];d-=h;if(d<w)return[x+w-d,y+h];d-=w;return[x,y+h-d];}
 function snake(o){return{o,head:null,trail:[],t:Math.random(),from:null,fly:1,target:null};}
 const S=[snake({pad:7,speed:.85,len:34,width:3.2,alpha:1,glow:46,spark:.9}),snake({pad:5,speed:.45,len:16,width:2,alpha:.42,glow:26,spark:.25})];
 function step(s,el,dt){const R=rectOf(el);if(!R){s.trail.length=0;s.head=null;s.target=null;return;}
  if(s.target!==el){s.from=s.head?[...s.head]:null;s.target=el;s.fly=s.from?0:1;}
  s.t+=s.o.speed*dt;const p=perim(R,s.o.pad,s.t);
  if(s.fly<1){s.fly=Math.min(1,s.fly+dt/0.45);const e=1-Math.pow(1-s.fly,3),mx=(s.from[0]+p[0])/2,my=Math.min(s.from[1],p[1])-40;const u=1-e;
   s.head=[u*u*s.from[0]+2*u*e*mx+e*e*p[0],u*u*s.from[1]+2*u*e*my+e*e*p[1]];}else s.head=p;
  s.trail.unshift([...s.head]);if(s.trail.length>s.o.len)s.trail.length=s.o.len;
  if(!RM&&Math.random()<s.o.spark){const a=Math.random()*Math.PI*2,v=20+Math.random()*50;parts.push({x:s.head[0],y:s.head[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v-10,life:0,max:.35+Math.random()*.35,r:1+Math.random()*1.6,c:s.o.alpha>.9?"255,200,110":"200,190,170",a:s.o.alpha});}
  return R;}
 function draw(s,R){if(!s.head)return;cx.save();cx.globalCompositeOperation="lighter";
  if(R){const g=cx.createRadialGradient(R.x+R.w/2,R.y+R.h/2,0,R.x+R.w/2,R.y+R.h/2,s.o.glow);g.addColorStop(0,`rgba(255,190,90,${.22*s.o.alpha})`);g.addColorStop(1,"rgba(255,190,90,0)");cx.fillStyle=g;cx.beginPath();cx.arc(R.x+R.w/2,R.y+R.h/2,s.o.glow,0,7);cx.fill();}
  for(let j=1;j<s.trail.length;j++){const f=1-j/s.trail.length,a=s.trail[j-1],b=s.trail[j];cx.strokeStyle=`rgba(255,${170+60*f|0},${80+80*f|0},${f*s.o.alpha})`;cx.lineWidth=s.o.width*(.35+f);cx.lineCap="round";cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();}
  const h=s.head,g2=cx.createRadialGradient(h[0],h[1],0,h[0],h[1],9);g2.addColorStop(0,`rgba(255,240,200,${s.o.alpha})`);g2.addColorStop(1,"rgba(255,180,80,0)");cx.fillStyle=g2;cx.beginPath();cx.arc(h[0],h[1],9,0,7);cx.fill();cx.restore();}
 function burst(el){if(RM)return;const R=rectOf(el);if(!R)return;const x=R.x+R.w/2,y=R.y+R.h/2;
  for(let j=0;j<46;j++){const a=Math.random()*Math.PI*2,v=60+Math.random()*170;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:.45+Math.random()*.5,r:1.2+Math.random()*2.4,c:Math.random()<.5?"255,200,110":"255,130,60",a:1});}
  rings.push({x,y,life:0});}
